name: pipewire_telephony_native
description: Linux Flutter and Dart bindings for PipeWire Bluetooth HFP telephony, with gateway discovery, call control, and SCO transport state over D-Bus.
version: 0.1.0
repository: https://github.com/jaydon2020/pipewire_telephony_native
issue_tracker: https://github.com/jaydon2020/pipewire_telephony_native/issues

environment:
  sdk: '>=3.10.1 <4.0.0'
  flutter: '>=3.38.3'

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  hooks: '>=1.0.2 <3.0.0'

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.0

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
